name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

  web:
    name: Web (lint, typecheck, build & unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun --cwd=apps/web/app run lint

      - name: Typecheck
        run: bun --cwd=apps/web/app run typecheck

      - name: Build
        run: bun --cwd=apps/web/app run build

      - name: Unit tests
        run: bun --cwd=apps/web/app run test

  e2e:
    name: E2E (Postgres service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arcdrop
          POSTGRES_PASSWORD: arcdrop
          POSTGRES_DB: arcdrop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcdrop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Consumed by the API from M1 onward; wired now so the job never changes shape.
      ARCDROP__DATABASE__URL: postgres://arcdrop:arcdrop@localhost:5432/arcdrop_test
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: E2E tests
        run: bun run test:e2e
