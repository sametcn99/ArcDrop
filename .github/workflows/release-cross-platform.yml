# Release pipeline (plan T6): tag push `v*` → desktop bundles + updater
# artifacts (signed when TAURI_SIGNING_PRIVATE_KEY secret exists) → draft
# GitHub Release, plus the Android release AAB/APK. The draft is published
# manually by the maintainer.
#
# Signing fallback (deliberate, v0.1.0): when secrets are absent the
# workflow still ships UNSIGNED artifacts —
#   * desktop: updater artifacts are disabled (config patched in-place),
#   * android: the APK/AAB keeps the `-unsigned` suffix.
# RELEASE.md documents keystore/signing-key generation and the exact secret
# names to fill in for signed releases.
name: Release Cross-Platform

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop bundles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles msi nsis'
          - os: macos-latest
            args: '--bundles dmg'
          - os: ubuntu-latest
            args: '--bundles appimage deb'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install web client dependencies
        run: bun install --frozen-lockfile

      - name: Install shell dependencies
        run: bun install --frozen-lockfile
        working-directory: cross-platform

      - name: Install Tauri Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust cache (release)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cross-platform/src-tauri
          key: release-desktop-${{ matrix.os }}

      # v0.1.0 fallback: without the updater signing secret, updater
      # artifacts are disabled so the bundles still ship (unsigned).
      - name: Disable updater artifacts when the signing key is absent
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e "const fs=require('fs');const p='cross-platform/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');console.log('updater artifacts disabled (no signing key)');"

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: cross-platform
          tagName: ${{ github.ref_name }}
          releaseName: 'ArcDrop ${{ github.ref_name }}'
          releaseBody: 'Draft release — see cross-platform/RELEASE.md for verification steps and known notes before publishing.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  android:
    name: Android release (AAB + APK)
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install web client dependencies
        run: bun install --frozen-lockfile

      - name: Install shell dependencies
        run: bun install --frozen-lockfile
        working-directory: cross-platform

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain with Android targets
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache (android)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cross-platform/src-tauri
          key: android

      # Plan T6 signing fallback: with keystore secrets the AAB/APK are
      # signed; without them the artifact keeps the -unsigned suffix.
      - name: Decode keystore when provided
        id: keystore
        env:
          ANDROID_KEYSTORE_FILE_B64: ${{ secrets.ANDROID_KEYSTORE_FILE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_FILE_B64" ]; then
            echo "$ANDROID_KEYSTORE_FILE_B64" | base64 -d > "$RUNNER_TEMP/arcdrop-release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No keystore secret — building an UNSIGNED release. See cross-platform/RELEASE.md for signing."
          fi

      - name: Build release AAB + APK
        run: bun run android:build:release
        working-directory: cross-platform
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/arcdrop-release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Collect artifacts
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          mkdir -p release-artifacts
          suffix=""; if [ "$SIGNED" != "true" ]; then suffix="-unsigned"; fi
          find cross-platform/src-tauri/gen/android/app/build/outputs \
            \( -name '*.apk' -o -name '*.aab' \) | while read -r src; do
              base="$(basename "$src")"
              name="${base%.*}"; ext="${base##*.}"
              cp "$src" "release-artifacts/${name}${suffix}.${ext}"
            done
          ls -la release-artifacts

      - name: Upload artifacts to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --json isDraft > /dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "ArcDrop $TAG" --notes "Draft release (android-only fallback)."
          gh release upload "$TAG" release-artifacts/* --clobber
