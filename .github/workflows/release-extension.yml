name: Package ArcDrop extensions

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build Chromium and Firefox ZIPs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun --cwd=extension install --frozen-lockfile

      - name: Check, build and verify extension packages
        run: |
          bun --cwd=extension run lint
          bun --cwd=extension run typecheck
          bun --cwd=extension run test
          bun --cwd=extension run build:release
          bun --cwd=extension run verify:release

      - uses: actions/upload-artifact@v4
        with:
          name: arcdrop-release-extension
          path: extension/dist/arcdrop-extension-*.zip
          compression-level: 0
          if-no-files-found: error
