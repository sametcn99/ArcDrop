name: Release (Extension)

# E6 release pipeline. Real releases are cut by pushing an `extension-v*`
# tag (the orchestrator publishes the resulting draft). workflow_dispatch
# without a tag is a build-only dry run: lint/typecheck/test/build run, the
# draft upload is skipped.

on:
  push:
    tags:
      - 'extension-v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: Build & package extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install extension dependencies
        run: bun --cwd=extension install --frozen-lockfile

      - name: Lint
        run: bun --cwd=extension run lint

      - name: Typecheck
        run: bun --cwd=extension run typecheck

      - name: Unit tests
        run: bun --cwd=extension run test

      - name: Build release packages (embed + zips)
        run: bun --cwd=extension run build:release

      - name: Verify release packages
        run: bun --cwd=extension run verify:release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arcdrop-extension-packages
          path: extension/dist/arcdrop-extension-*.zip
          if-no-files-found: error

      - name: Attach zips to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: extension/dist/arcdrop-extension-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
