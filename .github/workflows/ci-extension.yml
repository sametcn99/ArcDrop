name: CI (Extension)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    name: Extension (lint, typecheck & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Build normal web output
        run: |
          bun run web:build
          sha256sum apps/web/app/dist/index.html > "$RUNNER_TEMP/web-build.sha"

      - name: Install extension dependencies
        run: bun --cwd=extension install --frozen-lockfile

      - name: Lint
        run: bun --cwd=extension run lint

      - name: Typecheck
        run: bun --cwd=extension run typecheck

      - name: Unit tests
        run: bun --cwd=extension run test

      - name: Build and verify independent web and extension outputs
        run: |
          bun --cwd=extension run build:release
          bun --cwd=extension run verify:release
          sha256sum -c "$RUNNER_TEMP/web-build.sha"
          bun run web:build
          sha256sum -c "$RUNNER_TEMP/web-build.sha"
          bun --cwd=extension run verify:release

      - name: Install Chromium
        run: bunx --no-install playwright-core install --with-deps chromium

      - name: Load the Chromium extension
        run: bun dev-scripts/smoke-extension.ts

      - uses: browser-actions/setup-firefox@v1
        id: firefox

      - name: Install GeckoDriver
        run: |
          curl -fsSL --retry 3 https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz -o "$RUNNER_TEMP/geckodriver.tar.gz"
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Load the Firefox extension
        env:
          ARCDROP_FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: bun dev-scripts/smoke-extension-firefox.ts

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: |
            extension/dist/chromium
            extension/dist/firefox
          if-no-files-found: error
