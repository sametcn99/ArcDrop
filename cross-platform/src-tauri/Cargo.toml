[package]
name = "arcdrop"
version = "0.1.0"
description = "ArcDrop cross-platform shell"
authors = ["sametcn99"]
license = "MIT"
edition = "2021"

# The desktop binary reuses the library crate so mobile builds can load the
# same code through the platform frameworks (see [lib] below and src/main.rs).
[lib]
name = "arcdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde_json = "1"
arcdrop-share-target = { path = "plugins/share-target" }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
