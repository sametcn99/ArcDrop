[package]
name = "arcdrop-share-target"
version = "0.1.0"
description = "ArcDrop share-target plugin — receives Android ACTION_SEND text, extracts the first URL and emits it to the web client."
edition = "2021"
license = "MIT"
publish = false
# Required by the tauri-plugin build pipeline (permission codegen propagates
# to the consuming app through the cargo links/DEP mechanism).
links = "arcdrop-share-target"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
