name: arcdrop

# The web service is the single HTTP/WebSocket entry point.
# Use an HTTPS reverse proxy in front of it for a network deployment.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    environment:
      ARCDROP_WEB_TRUSTED_PROXY_CIDRS: ${ARCDROP_WEB_TRUSTED_PROXY_CIDRS:-127.0.0.1 ::1}
    ports:
      - '${ARCDROP_WEB_BIND:-127.0.0.1}:${ARCDROP_WEB_PORT:-3000}:8080'
    networks:
      gateway:
        ipv4_address: ${ARCDROP_WEB_GATEWAY_IP:-172.30.249.2}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/api/v1/readyz']
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      ARCDROP__DATABASE__URL: postgres://${POSTGRES_USER:-arcdrop}:${POSTGRES_PASSWORD:-arcdrop}@db:5432/${POSTGRES_DB:-arcdrop}
      # REQUIRED — compose refuses to start without it. No default signing
      # secret on purpose: a predictable secret means forgeable admin tokens.
      # Generate one with: openssl rand -hex 32  (shell env or .env file).
      ARCDROP__JWT__SECRET: '${ARCDROP__JWT__SECRET:?ARCDROP__JWT__SECRET must be set (32+ chars) - generate one, e.g. openssl rand -hex 32}'
      ARCDROP__PORT: '3000'
      ARCDROP__DATA_DIR: /data
      ARCDROP__CORS__ORIGINS: ${ARCDROP__CORS__ORIGINS:-}
      ARCDROP__METRICS__ENABLED: ${ARCDROP__METRICS__ENABLED:-false}
      ARCDROP__HTTP__TRUSTED_PROXIES: ${ARCDROP_WEB_GATEWAY_IP:-172.30.249.2}
      ARCDROP__RATE_LIMIT__PUBLIC_PER_MINUTE: ${ARCDROP__RATE_LIMIT__PUBLIC_PER_MINUTE:-60}
      ARCDROP__PUBLIC__BASE_URL: ${ARCDROP__PUBLIC__BASE_URL:-}
      ARCDROP__TOTP__ENCRYPTION_KEY: ${ARCDROP__TOTP__ENCRYPTION_KEY:-}
      ARCDROP__TOTP__PREVIOUS_ENCRYPTION_KEY: ${ARCDROP__TOTP__PREVIOUS_ENCRYPTION_KEY:-}
      ARCDROP__PORTABILITY__IMPORT_MAX_BYTES: ${ARCDROP__PORTABILITY__IMPORT_MAX_BYTES:-26214400}
      ARCDROP__PORTABILITY__IMPORT_ZIP_MAX_BYTES: ${ARCDROP__PORTABILITY__IMPORT_ZIP_MAX_BYTES:-314572800}
      ARCDROP__PORTABILITY__ZIP_EXPANDED_MAX_BYTES: ${ARCDROP__PORTABILITY__ZIP_EXPANDED_MAX_BYTES:-1073741824}
      ARCDROP__PORTABILITY__ZIP_MAX_ENTRIES: ${ARCDROP__PORTABILITY__ZIP_MAX_ENTRIES:-10000}
      ARCDROP__PORTABILITY__ZIP_CONCURRENT_TRANSFERS: ${ARCDROP__PORTABILITY__ZIP_CONCURRENT_TRANSFERS:-1}
      ARCDROP__LOG__LEVEL: ${ARCDROP__LOG__LEVEL:-info}
    networks:
      - default
      - gateway
    volumes:
      - arcdrop-data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      # bun is already in the image — no extra tooling needed for probing.
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arcdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arcdrop}
      POSTGRES_DB: ${POSTGRES_DB:-arcdrop}
    volumes:
      - arcdrop-pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-arcdrop} -d ${POSTGRES_DB:-arcdrop}']
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  gateway:
    ipam:
      config:
        - subnet: ${ARCDROP_GATEWAY_SUBNET:-172.30.249.0/29}

volumes:
  arcdrop-data:
  arcdrop-pgdata:
